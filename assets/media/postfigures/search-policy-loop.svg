<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="title desc">
<title id="title">An oracle advises an exact search</title>
<desc id="desc">The solver supplies legal actions. The oracle returns their order. The solver tries a branch, tests the constraints, and retains other branches for backtracking.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#556171" stroke-width="1.5"/></marker></defs>
<rect width="960" height="390" rx="20" fill="#f5f3ed"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="38" y="45" fill="#59616b" font-size="15" letter-spacing="2">A SMALL JOB FOR THE ORACLE</text>
<rect x="38" y="88" width="250" height="135" rx="12" fill="#fff" stroke="#c9cdd2"/>
<text x="60" y="125" fill="#182432" font-size="23" font-weight="bold">Exact solver</text>
<text x="60" y="158" fill="#455364" font-size="19">State + legal choices</text>
<text x="60" y="190" fill="#455364" font-size="18">A, B, C</text>
<path d="M290 151H348" stroke="#556171" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="360" y="88" width="240" height="135" rx="12" fill="#fff1e6" stroke="#cd7336"/>
<text x="382" y="125" fill="#182432" font-size="23" font-weight="bold">Policy oracle</text>
<text x="382" y="158" fill="#455364" font-size="19">Return probabilities</text>
<text x="382" y="190" fill="#455364" font-size="18">B: 0.6, A: 0.3, C: 0.1</text>
<path d="M602 151H660" stroke="#556171" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="672" y="88" width="250" height="135" rx="12" fill="#fff" stroke="#c9cdd2"/>
<text x="694" y="125" fill="#182432" font-size="23" font-weight="bold">Try B first</text>
<text x="694" y="158" fill="#455364" font-size="19">Test the constraints</text>
<text x="694" y="190" fill="#455364" font-size="18">Keep A and C available</text>
<path d="M797 226V280H163V226" fill="none" stroke="#556171" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="306" y="263" width="348" height="34" rx="8" fill="#f5f3ed"/>
<text x="480" y="286" text-anchor="middle" fill="#455364" font-size="18">Continue, or backtrack after failure</text>
<text x="480" y="348" text-anchor="middle" fill="#182432" font-size="20">The advice changes the order. The rules stay in code.</text>
</g></svg>
