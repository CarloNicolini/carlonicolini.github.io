title: Carlo Nicolini
tagline: Physics, machine learning & AI engineering
description: Research on learning, reasoning and complex systems. Scientific software and writing by Carlo Nicolini.
url: https://carlonicolini.github.io
baseurl: ""
linkedin_url: https://www.linkedin.com/in/carlo-nicolini/
author:
  name: Carlo Nicolini
  url: https://carlonicolini.github.io
logo: /assets/media/img/foto_nicolini.jpeg
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  math_engine: mathjax
  syntax_highlighter: rouge
  parse_block_html: true
permalink: /writing/:year/:month/:day/:title:output_ext
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-gist
  - jemoji
  - jekyll-include-cache
  - jekyll-relative-links
  - jekyll-scholar
  - jekyll/footnotes
scholar:
  style: apa
  locale: en
  bibliography: biblio.bib
  bibliography_dir: _bibliography
  bibliography_list_tag: ol
  bibliography_item_tag: li
  sort_by: none
  group_by: none
sass:
  style: compressed
exclude:
  - Gemfile
  - Gemfile.lock
  - Makefile
  - README.md
  - DESIGN.md
  - LICENSE
  - scripts
  - vendor
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      image: /assets/media/img/foto_nicolini.jpeg
social:
  name: Carlo Nicolini
  links:
    - https://github.com/carlonicolini
    - https://www.linkedin.com/in/carlo-nicolini
