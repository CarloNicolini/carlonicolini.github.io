[project]
name = "jekyll-dashboard"
version = "0.1.0"
description = "Local spreadsheet-style dashboard to organize Jekyll post front matter."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "ruamel.yaml>=0.18",
    "pydantic>=2.11",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.uv]
package = false
