<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" width="100%" height="100%">\n
<defs>
    <style>
        .title { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; fill: #333333; font-weight: 600; letter-spacing: 1.5px; }
        .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #78716c; }
        .section-title { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #4a4a4a; font-weight: 600; letter-spacing: 1px; }
        .math { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; fill: #57534e; }
        .math-accent { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; fill: #c2410c; }
        .label { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #78716c; }
        .label-accent { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; fill: #c2410c; font-weight: 500; }
        .label-main { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #4a4a4a; font-weight: 500; }
    </style>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 2 L 6 5 L 0 8" fill="none" stroke="#c2410c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
</defs>
\n  <rect width="1000" height="550" fill="#fafaf9" />\n  <text x="60" y="50" class="title">STRUCTURAL ADJACENCY MATRIX EXPANSION</text>\n  <text x="60" y="70" class="subtitle">RYS augmentation injects a dense bipartite block of new structural edges</text>\n  <text x="250" y="110" class="section-title" text-anchor="middle">BASE MODEL</text>\n  <text x="250" y="125" class="label" text-anchor="middle">N × N Structural Adjacency Matrix</text>\n  <rect x="150" y="150" width="200" height="200" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5" />\n  <polygon points="150,150 350,150 350,350" fill="#e7e5e4" />\n  <line x1="150" y1="150" x2="350" y2="350" stroke="#a8a29e" stroke-width="1" stroke-dasharray="2,2" />\n  <polygon points="220,220 280,220 280,280" fill="#ffedd5" opacity="0.8" />\n  <rect x="220" y="220" width="60" height="60" fill="none" stroke="#c2410c" stroke-width="1.5" stroke-dasharray="2,2" />\n  <text x="140" y="189.0" class="math" text-anchor="end">Encoder</text>\n  <text x="140" y="254.0" class="math-accent" text-anchor="end">Reasoning</text>\n  <text x="140" y="319.0" class="math" text-anchor="end">Decoder</text>\n  <text x="250.0" y="210" class="math-accent" text-anchor="middle">k</text>\n  <text x="295" y="254.0" class="math-accent" text-anchor="start">k</text>\n  <text x="700" y="110" class="section-title" text-anchor="middle">RYS AUGMENTED MODEL</text>\n  <text x="700" y="125" class="label" text-anchor="middle">(N + k) × (N + k) Structural Adjacency Matrix</text>\n  <rect x="570" y="150" width="260" height="260" fill="#ffffff" stroke="#d6d3d1" stroke-width="1.5" />\n  <polygon points="570,150 640,150 640,220" fill="#e7e5e4" />\n  <rect x="640" y="150" width="190" height="70" fill="#e7e5e4" />\n  <polygon points="640,220 700,220 700,280" fill="#ffedd5" opacity="0.8" />\n  <rect x="760" y="220" width="70" height="60" fill="#e7e5e4" />\n  <polygon points="700,280 760,280 760,340" fill="#ffedd5" opacity="0.8" />\n  <rect x="760" y="280" width="70" height="60" fill="#e7e5e4" />\n  <polygon points="760,340 830,340 830,410" fill="#e7e5e4" />\n  <rect x="700" y="220" width="60" height="60" fill="#c2410c" opacity="0.2" />\n  <rect x="640" y="220" width="120" height="120" fill="none" stroke="#c2410c" stroke-width="1.5" stroke-dasharray="2,2" />\n  <rect x="700" y="220" width="60" height="60" fill="none" stroke="#c2410c" stroke-width="2" />\n  <line x1="570" y1="150" x2="830" y2="410" stroke="#a8a29e" stroke-width="1" stroke-dasharray="2,2" />\n  <text x="560" y="189.0" class="math" text-anchor="end">Encoder</text>\n  <text x="560" y="254.0" class="math-accent" text-anchor="end">Pass 1</text>\n  <text x="560" y="314.0" class="math-accent" text-anchor="end">Pass 2</text>\n  <text x="560" y="379.0" class="math" text-anchor="end">Decoder</text>\n  <text x="670.0" y="210" class="math-accent" text-anchor="middle">k</text>\n  <text x="730.0" y="210" class="math-accent" text-anchor="middle">k</text>\n  <text x="775" y="254.0" class="math-accent" text-anchor="start">k</text>\n  <text x="775" y="314.0" class="math-accent" text-anchor="start">k</text>\n  <path d="M 730.0 180 L 730.0 215" fill="none" stroke="#c2410c" stroke-width="1.5" marker-end="url(#arrow-orange)" />\n  <text x="730.0" y="170" class="label-accent" text-anchor="middle">Fully Dense Bipartite Block</text>\n  <text x="730.0" y="155" class="math-accent" text-anchor="middle">k² new feedforward edges</text>\n  <text x="700.0" y="450" class="label-main" text-anchor="middle">The RYS sub-DAG is twice as deep but has <tspan fill="#c2410c">three times</tspan> as many edges.</text>\n  <text x="700.0" y="470" class="label" text-anchor="middle">Every node in Pass 1 structurally precedes every node in Pass 2.</text>\n</svg>